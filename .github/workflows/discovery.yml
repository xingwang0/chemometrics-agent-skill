name: discovery

# 发现入口的哨兵：仓库在 GitHub 站内搜索、topic 列表、skills.sh 目录里是否还能被检索到。
# 权重会随 star 数、索引重建、目录算法变化而漂移，所以每周测一次，掉出去就红。

on:
  schedule:
    - cron: "17 2 * * 1"        # 每周一 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check discovery surfaces
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.parse

          repo = os.environ["REPO"]
          owner = os.environ["OWNER"]
          name = repo.split("/")[1]
          fails, warns, ok = [], [], []

          def get(url):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "discovery-canary",
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # 1) 仓库元数据：description 与 topics 是 GitHub 默认搜索唯一检索的三个字段之一
          try:
              meta = get(f"https://api.github.com/repos/{repo}")
              desc = meta.get("description") or ""
              topics = meta.get("topics") or []
              ok.append(f"repo: {meta['stargazers_count']} stars, {len(topics)} topics, pushed {meta['pushed_at'][:10]}")
              if "chemometrics" not in desc.lower():
                  warns.append("About 描述里没有 chemometrics —— 默认搜索只吃 name/description/topics")
              if len(topics) < 15:
                  warns.append(f"topics 只有 {len(topics)} 个（上限 20）")
          except Exception as e:
              fails.append(f"repo API 失败: {e}")

          # 2) 精确长尾查询必须命中自己
          q = urllib.parse.quote("chemometrics agent skill")
          try:
              res = get(f"https://api.github.com/search/repositories?q={q}")
              names = [i["full_name"] for i in res.get("items", [])]
              if repo in names:
                  ok.append(f"GitHub 搜索 'chemometrics agent skill': 命中，第 {names.index(repo) + 1}/{res['total_count']}")
              else:
                  fails.append(f"GitHub 搜索 'chemometrics agent skill' 未命中（共 {res['total_count']} 条）")
          except Exception as e:
              fails.append(f"GitHub search API 失败: {e}")

          # 3) skills.sh 目录：agent 的 find-skills 查这里。未收录只警告，收录后再升级为失败
          for term in ("chemometrics", "research-ml-modeling"):
              try:
                  res = get(f"https://skills.sh/api/search?q={urllib.parse.quote(term)}")
                  hits = [s for s in res.get("skills", []) if s.get("source") == repo or s.get("source", "").startswith(owner + "/" + name)]
                  if hits:
                      ok.append(f"skills.sh '{term}': 已收录，installs={hits[0].get('installs')}")
                  else:
                      warns.append(f"skills.sh '{term}': 未收录（{res.get('count')} 条结果里没有本仓库）")
              except Exception as e:
                  warns.append(f"skills.sh '{term}' 查询失败: {e}")

          lines = ["## Discovery canary", ""]
          lines += [f"- ✅ {x}" for x in ok]
          lines += [f"- ⚠️ {x}" for x in warns]
          lines += [f"- ❌ {x}" for x in fails]
          summary = "\n".join(lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary + "\n")

          sys.exit(1 if fails else 0)
          PY
